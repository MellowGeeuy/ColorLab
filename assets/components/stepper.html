<!-- @preview -->
<div class="ui-stack">
  <div class="ui-field">
    <label class="ui-field__label" for="step-qty">จำนวนที่สั่ง</label>
    <div class="ui-stepper" data-part="p1">
      <button type="button" class="ui-stepper__btn" aria-label="ลดจำนวนลงหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
      <input class="ui-stepper__input" id="step-qty" type="text" inputmode="numeric" value="12">
      <button type="button" class="ui-stepper__btn" aria-label="เพิ่มจำนวนขึ้นหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
      </button>
      <span class="ui-stepper__unit">กล่อง</span>
    </div>
    <p class="ui-field__helper">สั่งได้ครั้งละ 1 ถึง 48 กล่อง พิมพ์ตัวเลขเองได้</p>
  </div>

  <div class="ui-field">
    <label class="ui-field__label" for="step-min">ถึงขีดต่ำสุดแล้ว</label>
    <div class="ui-stepper">
      <button type="button" class="ui-stepper__btn" disabled aria-label="ลดจำนวนลงหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
      <input class="ui-stepper__input" id="step-min" type="text" inputmode="numeric" value="1">
      <button type="button" class="ui-stepper__btn" aria-label="เพิ่มจำนวนขึ้นหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
      </button>
    </div>
    <p class="ui-field__helper">ปุ่มลดถูกปิดไว้ เพราะน้อยกว่านี้สั่งไม่ได้</p>
  </div>

  <div class="ui-field ui-field--error">
    <label class="ui-field__label" for="step-over">เกินจำนวนที่มี</label>
    <div class="ui-stepper" data-state="error" data-part="p2">
      <button type="button" class="ui-stepper__btn" aria-label="ลดจำนวนลงหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
      <input class="ui-stepper__input" id="step-over" type="text" inputmode="numeric" value="60">
      <button type="button" class="ui-stepper__btn" aria-label="เพิ่มจำนวนขึ้นหนึ่ง">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
      </button>
    </div>
    <p class="ui-field__error">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.5h.01"/></svg>
      คลังเหลือ 48 กล่อง ลดจำนวนลงหรือแยกเป็นสองรอบส่ง
    </p>
  </div>
</div>
<!-- @end -->
