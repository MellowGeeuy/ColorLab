<!-- @card -->
<div class="ui-slider">
  <span class="ui-slider__track"><span class="ui-slider__fill" style="width:45%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:45%"></span></span>
  <span class="ui-slider__scale"><span>0</span><span>100</span></span>
</div>
<!-- @end -->

<!-- @preview -->
<div class="ui-stack">
  <div class="ui-field" data-part="p1">
    <label class="ui-field__label" for="slider-budget">
      งบต่อวัน <span class="ui-slider__value">450 บาท</span>
    </label>
    <div class="ui-slider">
      <span class="ui-slider__track" role="slider" id="slider-budget" tabindex="0"
            aria-valuemin="0" aria-valuemax="1000" aria-valuenow="450" aria-valuetext="450 บาท">
        <span class="ui-slider__fill" style="width:45%"></span>
        <span class="ui-slider__thumb" style="inset-inline-start:45%"></span>
      </span>
      <span class="ui-slider__scale"><span>0</span><span>500</span><span>1,000</span></span>
    </div>
    <p class="ui-field__helper">เลื่อนได้ทีละ 10 บาท หรือกดลูกศรซ้ายขวาเมื่อโฟกัสอยู่</p>
  </div>

  <div class="ui-field">
    <span class="ui-field__label">ช่วงราคาที่ต้องการ <span class="ui-slider__value">200 ถึง 700 บาท</span></span>
    <div class="ui-slider" data-part="p2">
      <span class="ui-slider__track">
        <span class="ui-slider__fill" style="inset-inline-start:20%;width:50%"></span>
        <span class="ui-slider__thumb" style="inset-inline-start:20%"></span>
        <span class="ui-slider__thumb" style="inset-inline-start:70%"></span>
      </span>
      <span class="ui-slider__scale"><span>0</span><span>500</span><span>1,000</span></span>
    </div>
  </div>

  <div class="ui-field">
    <span class="ui-field__label">ระดับความละเอียด <span class="ui-slider__value">กลาง</span></span>
    <div class="ui-slider ui-slider--ticks">
      <span class="ui-slider__track" data-state="focus">
        <span class="ui-slider__fill" style="width:50%"></span>
        <span class="ui-slider__tick" style="inset-inline-start:0%"></span>
        <span class="ui-slider__tick" style="inset-inline-start:25%"></span>
        <span class="ui-slider__tick" style="inset-inline-start:50%"></span>
        <span class="ui-slider__tick" style="inset-inline-start:75%"></span>
        <span class="ui-slider__tick" style="inset-inline-start:100%"></span>
        <span class="ui-slider__thumb" style="inset-inline-start:50%"></span>
      </span>
      <span class="ui-slider__scale"><span>ต่ำสุด</span><span>กลาง</span><span>สูงสุด</span></span>
    </div>
  </div>
</div>
<!-- @end -->

<!-- @variants -->
<div class="cs-variant" data-variant-label="ปกติ — รางที่ยังไม่ถูกเลือกต้องเห็นเต็มความยาว">
  <div class="ui-slider"><span class="ui-slider__track">
    <span class="ui-slider__fill" style="width:45%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:45%"></span></span></div>
</div>

<div class="cs-variant" data-variant-label="กำลังโฟกัส — วงแหวนรอบปุ่ม ไม่ใช่รอบรางทั้งเส้น">
  <div class="ui-slider"><span class="ui-slider__track" data-state="focus">
    <span class="ui-slider__fill" style="width:45%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:45%"></span></span></div>
</div>

<div class="cs-variant" data-variant-label="สองปุ่ม — เลือกเป็นช่วง ค่าต้องเขียนกำกับไว้เสมอ">
  <div class="ui-slider"><span class="ui-slider__track">
    <span class="ui-slider__fill" style="inset-inline-start:20%;width:50%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:20%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:70%"></span></span></div>
</div>

<div class="cs-variant" data-variant-label="มีขีดบอกระดับ — ใช้เมื่อค่าที่เลือกได้เป็นขั้น ไม่ต่อเนื่อง">
  <div class="ui-slider ui-slider--ticks"><span class="ui-slider__track">
    <span class="ui-slider__fill" style="width:50%"></span>
    <span class="ui-slider__tick" style="inset-inline-start:0%"></span>
    <span class="ui-slider__tick" style="inset-inline-start:50%"></span>
    <span class="ui-slider__tick" style="inset-inline-start:100%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:50%"></span></span></div>
</div>

<div class="cs-variant" data-variant-label="ปรับไม่ได้ — ทั้งรางและปุ่มจางลงพร้อมกัน">
  <div class="ui-slider" data-state="disabled"><span class="ui-slider__track">
    <span class="ui-slider__fill" style="width:45%"></span>
    <span class="ui-slider__thumb" style="inset-inline-start:45%"></span></span></div>
</div>
<!-- @end -->
