<!-- @card -->
<div class="ui-tags">
  <span class="ui-tag">การเงิน
    <button type="button" class="ui-tag__x" aria-label="เอา การเงิน ออก">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </span>
  <span class="ui-tag">ด่วน
    <button type="button" class="ui-tag__x" aria-label="เอา ด่วน ออก">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </span>
  <span class="ui-tags__ghost">เพิ่มป้าย</span>
</div>
<!-- @end -->

<!-- @preview -->
<div class="ui-stack">
  <div class="ui-field">
    <label class="ui-field__label" for="tag-input">ป้ายกำกับเอกสาร</label>
    <div class="ui-tags" data-state="focus" data-part="p1">
      <span class="ui-tag">การเงิน
        <button type="button" class="ui-tag__x" aria-label="เอา การเงิน ออก">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </span>
      <span class="ui-tag">ด่วน
        <button type="button" class="ui-tag__x" aria-label="เอา ด่วน ออก">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </span>
      <span class="ui-tag ui-tag--invalid">ไตรมาส 5
        <button type="button" class="ui-tag__x" aria-label="เอา ไตรมาส 5 ออก">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </span>
      <input class="ui-tags__input" id="tag-input" type="text" placeholder="พิมพ์แล้วกด Enter" autocomplete="off">
    </div>
    <p class="ui-field__helper">กด Enter เพื่อเพิ่ม กด Backspace ที่ช่องว่างเพื่อลบป้ายล่าสุด</p>
  </div>

  <div class="ui-field">
    <span class="ui-field__label">ป้ายที่ใช้บ่อย</span>
    <div class="ui-chip-row" data-part="p2">
      <button type="button" class="ui-chip" aria-pressed="true">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        การเงิน
      </button>
      <button type="button" class="ui-chip" aria-pressed="false">จัดซื้อ</button>
      <button type="button" class="ui-chip" aria-pressed="false">สัญญา</button>
      <button type="button" class="ui-chip" aria-pressed="false">ภายในทีม</button>
    </div>
  </div>

  <div class="ui-field ui-field--error">
    <span class="ui-field__label">ป้ายที่ยังไม่มีในระบบ</span>
    <p class="ui-field__error">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.5h.01"/></svg>
      “ไตรมาส 5” ยังไม่มีในรายการป้าย กด Enter ซ้ำเพื่อสร้างใหม่ หรือลบทิ้ง
    </p>
  </div>
</div>
<!-- @end -->

<!-- @variants -->
<div class="cs-variant" data-variant-label="ว่าง — ข้อความชี้แนะบอกวิธีเพิ่ม">
  <div class="ui-tags"><input class="ui-tags__input" type="text" placeholder="พิมพ์แล้วกด Enter" aria-label="ป้าย"></div>
</div>

<div class="cs-variant" data-variant-label="มีป้ายแล้ว — แต่ละป้ายถอดออกได้ทีละอัน">
  <div class="ui-tags">
    <span class="ui-tag">การเงิน<button type="button" class="ui-tag__x" aria-label="เอาออก">
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
    <input class="ui-tags__input" type="text" aria-label="ป้าย">
  </div>
</div>

<div class="cs-variant" data-variant-label="กำลังโฟกัส — วงแหวนอยู่รอบทั้งกล่อง ไม่ใช่รอบช่องพิมพ์">
  <div class="ui-tags" data-state="focus">
    <span class="ui-tag">ด่วน<button type="button" class="ui-tag__x" aria-label="เอาออก">
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
    <input class="ui-tags__input" type="text" aria-label="ป้าย">
  </div>
</div>

<div class="cs-variant" data-variant-label="ป้ายที่ยังไม่มีในระบบ — ขอบประบอกว่าต่างจากป้ายปกติ">
  <span class="ui-tag ui-tag--invalid">ไตรมาส 5<button type="button" class="ui-tag__x" aria-label="เอาออก">
    <svg class="ui-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
</div>

<div class="cs-variant" data-variant-label="เลือกจากป้ายที่มี — ตัวที่เลือกมีเครื่องหมายถูก">
  <div class="ui-chip-row">
    <button type="button" class="ui-chip" aria-pressed="true">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      การเงิน
    </button>
    <button type="button" class="ui-chip" aria-pressed="false">จัดซื้อ</button>
  </div>
</div>
<!-- @end -->
